  <style>
    .timeline{
      position:relative;
      max-width:800px;
      margin:60px auto;
      padding:40px 0;
    }

    .timeline-line{
      position:absolute;
      left:50%;
      top:0;
      width:4px;
      height:100%;
      background:linear-gradient(to bottom, var(--borderSoft), var(--blue));
      transform:translateX(-50%);
    }

    .timeline-item{
      position:relative;
      display:grid;
      grid-template-columns:1fr 80px 1fr;
      align-items:center;
      margin:80px 0;
      opacity:0;
      transform:translateY(40px);
      transition:opacity .6s ease, transform .6s ease;
    }

    .timeline-item.visible{
      opacity:1;
      transform:translateY(0);
    }

    .timeline-item.left .content{
      grid-column:1;
      text-align:right;
    }

    .timeline-item.right .content{
      grid-column:3;
      text-align:left;
    }

    .content{
      background:#fff;
      border:1px solid var(--borderSoft);
      border-radius:14px;
      padding:18px 22px;
      box-shadow:var(--shadowSoft);
      max-width:320px;
    }

    .content h3{
      margin:0 0 6px;
      font-size:16px;
    }

    .content p{
      margin:0;
      font-size:14px;
      color:var(--muted);
      line-height:1.5;
    }

    .cube-wrap{
      grid-column:2;
      display:flex;
      justify-content:center;
      perspective:800px;
    }

css/style.css
.cube{
  transform: rotateX(-24deg) rotateY(30deg);
}


    .cube-face{
      position:absolute;
      width:48px;
      height:48px;
      background:#000;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:2px;
      padding:4px;
      border-radius:6px;
    }

    .cube-face span{
      border-radius:2px;
    }

    .front{transform:translateZ(24px)}
    .back{transform:rotateY(180deg) translateZ(24px)}
    .right{transform:rotateY(90deg) translateZ(24px)}
    .left{transform:rotateY(-90deg) translateZ(24px)}
    .top{transform:rotateX(90deg) translateZ(24px)}
    .bottom{transform:rotateX(-90deg) translateZ(24px)}

    .w{background:#fff}
    .y{background:#ffd500}
    .r{background:#c41e3a}
    .o{background:#ff5800}
    .b{background:#0051ba}
    .g{background:#009e60}

    @media (max-width:760px){
      .timeline-line{left:32px}
      .timeline-item{
        grid-template-columns:80px 1fr;
      }
      .cube-wrap{grid-column:1}
      .content{grid-column:2;text-align:left}
    }
  </style>
</head>

<script>
  const items = document.querySelectorAll('.timeline-item');
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting) e.target.classList.add('visible');
    });
  },{threshold:0.25});
  items.forEach(i=>observer.observe(i));
</script>
